<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BeyondWires</title>
<!-- Forgot password (customer accounts only). Without ?token= it asks for the email and sends a link;
     with ?token= (the link from the email) it sets the new password. Logic: JS/ResetPassword.js -->
<link rel="icon" type="image/png" href="../Assets/BWLOGO.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  (function () {   // same theme as the landing page (saved choice, light by default)
    var dark = false;
    try { dark = localStorage.getItem("theme") === "dark"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
  :root { --bg:#f3f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#dbe3ee; --input:#f8fafc; --blue:#0077F6; --blue-dark:#1B49B8; --warn-bg:#fff7e6; --warn:#9a6700; --err-bg:#fdecec; --err:#c62828; }
  :root[data-theme="dark"] { --bg:#080B11; --card:#101826; --text:#e5ecf7; --muted:#94a3b8; --line:#22324f; --input:#0c1424; --warn-bg:#2a2210; --warn:#f5c451; --err-bg:#2c1416; --err:#f87171; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 34px 30px 26px; box-shadow: 0 20px 45px rgba(15,23,42,.12); }
  .logo { display: block; width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; object-fit: cover; }
  h1 { text-align: center; font-size: 22px; font-weight: 800; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 6px 0 18px; }
  .note { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 18px; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: var(--input); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .field input:focus { border-color: var(--blue); }
  .field input.invalid { border-color: var(--err); }
  .pw { position: relative; }
  .pw input { padding-right: 44px; }
  .pw i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; line-height: 20px; text-align: center; color: var(--muted); cursor: pointer; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .role-opt { height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .role-opt.active { border-color: var(--blue); background: rgba(0,119,246,.1); color: var(--blue); }
  .error { display: none; background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .error.show { display: block; }
  .btn { width: 100%; height: 46px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: var(--blue-dark); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .back { display: block; text-align: center; margin-top: 16px; color: var(--blue); font-size: 14px; font-weight: 600; text-decoration: none; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
<style>
  .ok { display: none; background: rgba(19,128,90,.12); color: #13805a; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .ok.show { display: block; }
  :root[data-theme="dark"] .ok { color: #4ade80; }
  .hint { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .field-err { display: block; color: var(--err); font-size: 12px; margin-top: 6px; min-height: 0; }
</style>
<script src="../JS/api.js" defer></script>
<script src="../JS/ResetPassword.js?v=20261021" defer></script>
</head>
<body>
  <main class="card">
    <img class="logo" src="../Assets/BWLOGO.png" alt="BeyondWires">

    <!-- Step 1: ask for the reset link -->
    <section id="askView">
      <h1>Forgot Password</h1>
      <p class="sub">Enter the email of your account and we'll send you a link to reset your password.</p>
      <div class="ok" id="askOk" role="status"></div>
      <div class="error" id="askError" role="alert"></div>
      <form id="askForm" novalidate autocomplete="off">
        <label class="field"><span>Email Address</span>
          <input id="askEmail" type="email" placeholder="you@gmail.com" autocomplete="off">
          <small class="field-err" id="askEmailErr"></small>
        </label>
        <button class="btn" type="submit" id="askBtn">Send reset link</button>
      </form>
    </section>

    <!-- Step 2: set the new password (opened from the email link) -->
    <section id="resetView" hidden>
      <h1>Set a New Password</h1>
      <p class="sub">Choose a new password for your account.</p>
      <div class="ok" id="resetOk" role="status"></div>
      <div class="error" id="resetError" role="alert"></div>
      <form id="resetForm" novalidate autocomplete="off">
        <label class="field"><span>New Password</span>
          <span class="pw"><input id="newPw" type="password" placeholder="New password" autocomplete="new-password"><i class="fa-solid fa-eye" data-eye="newPw" role="button" aria-label="Show password"></i></span>
          <small class="hint">Use at least 8 characters and include a number.</small>
          <small class="field-err" id="newPwErr"></small>
        </label>
        <label class="field"><span>Confirm New Password</span>
          <span class="pw"><input id="confPw" type="password" placeholder="Type it again" autocomplete="new-password"><i class="fa-solid fa-eye" data-eye="confPw" role="button" aria-label="Show password"></i></span>
          <small class="field-err" id="confPwErr"></small>
        </label>
        <button class="btn" type="submit" id="resetBtn">Change password</button>
      </form>
    </section>

    <a class="back" id="backLink" href="LandingPage.html#login">Back to log in</a>
    <p class="foot"><i class="fa-solid fa-lock"></i> Secure access by BeyondWires</p>
  </main>
</body>
</html>
